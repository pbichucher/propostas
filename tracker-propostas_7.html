<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Propostas Terrenos da Família</title>
<style>
  :root {
    --text: #1a1a1a;
    --muted: #8a8a86;
    --line: #e8e8e4;
    --bg: #fdfdfc;
    --accent: #1a6e4a;
    --warn: #b0541d;
    --vgv: #6a4ea0;
    --hover: #f6f6f3;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 48px 24px 80px; }

  header h1 { font-size: 21px; font-weight: 650; letter-spacing: -0.02em; }
  header p { color: var(--muted); font-size: 13px; margin-top: 2px; }

  .totals { display: flex; gap: 38px; margin: 28px 0 14px; flex-wrap: wrap; }
  .totals .lbl { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .totals .val { display: block; font-size: 19px; font-weight: 600; margin-top: 2px; }

  .legend { font-size: 11.5px; color: var(--muted); margin: 0 0 26px; display: flex; gap: 16px; flex-wrap: wrap; }
  .legend b { color: var(--text); font-weight: 600; }

  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: right; font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--muted); padding: 8px 10px;
    border-bottom: 1px solid var(--text); white-space: nowrap;
  }
  th:first-child { text-align: left; padding-left: 8px; }
  th.l { text-align: left; }
  td {
    padding: 10px; text-align: right; border-bottom: 1px solid var(--line);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  td:first-child { text-align: left; padding-left: 8px; }

  tr.terreno > td { font-weight: 600; background: #f4f4f1; border-bottom: 1px solid #dededa; }
  tr.terreno > td:first-child { font-size: 14px; }
  tr.terreno.clickable { cursor: pointer; }
  tr.terreno.clickable:hover > td { background: #eeeeea; }

  tr.lote, tr.prop { cursor: default; }
  tr.lote.clickable, tr.prop.clickable { cursor: pointer; }
  tr.lote.clickable:hover > td, tr.prop.clickable:hover > td { background: var(--hover); }
  tr.lote > td:first-child { padding-left: 26px; font-weight: 400; }
  tr.prop > td:first-child { padding-left: 26px; font-weight: 400; }
  tr.prop.lvl2 > td:first-child { padding-left: 44px; }
  tr.prop > td { color: #4a4a47; }
  tr.lote .chev, tr.prop .chev { color: var(--muted); font-size: 9px; display: inline-block; width: 13px; transition: transform .15s; }
  tr.lote.open .chev, tr.prop.open .chev { transform: rotate(90deg); }

  .chip {
    display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 8px;
    border-radius: 99px; white-space: nowrap;
  }
  .who { color: var(--muted); font-weight: 400; }
  .semprop { color: var(--muted); font-style: italic; font-size: 12.5px; }


  /* detalhe */
  tr.detail > td { padding: 12px 10px 14px 40px; text-align: left; background: #fbfbf9; white-space: normal; }
  .d-grid { display: flex; gap: 30px; flex-wrap: wrap; font-size: 13px; margin-bottom: 8px; }
  .d-grid .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
  .d-grid .v { font-weight: 600; font-variant-numeric: tabular-nums; }
  .d-notes { font-size: 12.5px; color: var(--muted); max-width: 700px; }
  .d-notes b { color: var(--text); font-weight: 550; }
  .d-notes .warn { color: var(--warn); }
  .muted { color: var(--muted); }

  @media (max-width: 740px) {
    .wrap { padding: 26px 12px 60px; }
    .hide-sm { display: none; }
    .totals { gap: 22px; }
  }

  /* nav */
  .nav { display: flex; gap: 6px; margin: 18px 0 10px; }
  .nav button { font: inherit; font-size: 13px; font-weight: 600; color: var(--muted);
    background: none; border: 1px solid var(--line); border-radius: 99px; padding: 6px 16px; cursor: pointer; }
  .nav button.active { color: var(--text); border-color: var(--text); background: #fff; }

  /* comparador */
  .cmp-controls { display: flex; gap: 14px 18px; flex-wrap: wrap; align-items: flex-end; margin: 6px 0 14px; }
  .cmp-field { display: flex; flex-direction: column; gap: 4px; }
  .cmp-field label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .cmp-field select { font: inherit; font-size: 13px; padding: 7px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: #fff; color: var(--text); min-width: 170px; }

  .sales-box { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; }
  .sales-box.off { opacity: .4; }
  .sales-head { font-size: 12.5px; font-weight: 600; margin-bottom: 9px; }
  .sales-head .muted { font-weight: 400; }
  .sales-input { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  .sales-input .yr { display: flex; flex-direction: column; gap: 3px; }
  .sales-input .yr label { font-size: 10.5px; color: var(--muted); }
  .sales-input .yr .mrange { color: #b7b7b2; }
  .sales-input input { width: 62px; font: inherit; font-size: 13px; padding: 6px 8px;
    border: 1px solid var(--line); border-radius: 7px; text-align: right; }
  .sales-input .rep { margin-left: 6px; padding-left: 14px; border-left: 1px solid var(--line); }
  .sales-sum { font-size: 12px; color: var(--muted); padding-bottom: 7px; }
  .sales-sum.bad { color: var(--warn); font-weight: 600; }

  .stepper { display: flex; flex-wrap: wrap; margin: 0 0 18px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .step { flex: 1 1 0; min-width: 96px; padding: 8px 12px; border-right: 1px solid var(--line); }
  .step:last-child { border-right: none; }
  .step .m { font-size: 10.5px; color: var(--muted); }
  .step .n { font-size: 12.5px; font-weight: 600; margin-top: 1px; }

  .prop-block { border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
  .prop-block h3 { font-size: 15px; font-weight: 650; display: flex; align-items: center; gap: 9px; }
  .prop-block h3 .num { width: 20px; height: 20px; border-radius: 50%; color: #fff; font-size: 12px;
    display: inline-flex; align-items: center; justify-content: center; }
  .prop-block h3 .tag { font-size: 12.5px; color: var(--muted); font-weight: 500; }
  .prop-terms { display: flex; gap: 28px; flex-wrap: wrap; margin: 13px 0 6px; }
  .prop-terms .lbl { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .prop-terms .val { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .prop-terms .best { font-size: 10px; font-weight: 700; color: #fff; padding: 1px 6px; border-radius: 99px; margin-left: 5px; vertical-align: 2px; }
  .prop-chart { overflow-x: auto; margin-top: 8px; }
  .prop-chart svg { display: block; width: 100%; height: auto; min-width: 520px; }
  .chart-cap { font-size: 11px; color: var(--muted); margin-top: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Propostas Terrenos da Família</h1>
    <p>André Bichucher · Atualizado em 13/06/2026</p>
  </header>

  <div class="nav">
    <button id="navP" class="active" onclick="setView('p')">Propostas</button>
    <button id="navC" onclick="setView('c')">Comparador de fluxo</button>
  </div>

  <div id="viewPropostas">
    <div class="totals" id="totals"></div>
    <div class="legend">
      <span><b>TPA</b> André (ERG Incorp.)</span>
      <span><b>Grupo A</b> André, Otto, Bernardo</span>
      <span><b>Grupo B</b> Adolfo, Dominique, Cláudio</span>

    </div>

  </div>

  <div id="viewComparador" style="display:none"><div id="cmpRoot"></div></div>
</div>

<script>
// ── DADOS ─────────────────────────────────────────────────────────────────────

// vgv do terreno = soma dos lotes. Pedido do lote = área × vpm2_alvo.
// Fontes VGV: fotos (totais do terreno) ou extrapolação pelo R$/m² da foto / oferta.

  { id:'santos-dumont', name:'Santos Dumont 3636', vpm2_alvo:8635, lotes:[

      { buyer:'Riva Incorporadora', tipo:'permuta', permutaPct:14, vgv:290.666, valor:44.53, valorLiquido:40.08, vpm2:3004, areaConsiderada:14822, date:'2026-06-10', validade:'2026-07-10', pagamento:'Fluxo de recebíveis + medição de obra. Opção de compra 90 dias.', notes:'Desconto de 10% de comercialização embutido no líquido. Riva ofertou só 14.822 m² dos 18.974 m² do Otto + Bernardo.' },

  { id:'quadra-45', name:'Quadra 45', vpm2_alvo:2000, lotes:[
    { nome:'Lote 1 — Frente Mar', dono:'Grupo A', area:4887.5, vgv:116.48, props:[
      { buyer:'Riva Incorporadora', tipo:'permuta', permutaPct:12, vgv:119.392, valor:14.327, valorLiquido:14.327, sinalPCV:0.5, escritura:2.0, vpm2:2932, areaConsiderada:4887.5, date:'2026-08-06', validade:'2026-09-05', pagamento:'Sinal R$ 2,5 M (R$ 500 mil na PCV + R$ 2,0 M na escritura/alvará) + permuta financeira 9,91% (R$ 11,83 M) durante as vendas. 416 unid. de 28 m². Opção de compra 90 dias.', notes:'Proposta nova de 06/08/2026 (Praia do Futuro II, 4.887,50 m²). Valor do terreno = 12% do VGV = R$ 14.327.040, sem desconto. ITBI e cartório por conta da compradora.' },
      { buyer:'Tenda Permuta Financeira', tipo:'permuta', permutaPct:10.68, vgv:94.246, valor:10.068, valorLiquido:9.867, vpm2:2064, areaConsiderada:4877.5, date:'2026-06-24', validade:'2026-07-24', pagamento:'Permuta financeira 10,68%. 282 unid. de 39,03 m², T+12, R$ 334.204/unid. Opção de compra 90 dias, lançamento 12+6 meses.', notes:'Via André Romcy / NUAAR. ⚠️ Vendedor paga 2% de corretagem. Valor referencial R$ 10.068.250 (R$ 2.064,22/m²).' },
      { buyer:'Tenda Permuta Física', tipo:'permuta-fisica', permutaPct:12.06, vgv:94.246, valor:11.366, valorLiquido:11.139, vpm2:2330, areaConsiderada:4877.5, date:'2026-06-24', validade:'2026-07-24', pagamento:'Permuta física 12,06% (34 apartamentos). 282 unid. de 39,03 m², T+12. Opção de compra 90 dias, lançamento 12+6 meses.', notes:'Via André Romcy / NUAAR. ⚠️ Vendedor paga 2% de corretagem. Valor referencial R$ 11.366.015,60 (R$ 2.330,29/m²).' },
      { buyer:'Tenda Pagamento', tipo:'venda', vgv:94.246, valor:9.751, valorLiquido:9.556, sinal:0.487528, parcela:0.257307, nParc:36, vpm2:1995, areaConsiderada:4877.5, date:'2026-06-24', validade:'2026-07-24', pagamento:'Fluxo financeiro: sinal R$ 487.528,13 + 36 parcelas de R$ 257.306,51. Opção de compra 90 dias, lançamento 12+6 meses.', notes:'Via André Romcy / NUAAR. ⚠️ Vendedor paga 2% de corretagem. Valor referencial R$ 9.750.562,50 (R$ 1.995/m²).' },
    ]},
    { nome:'Lote 2', dono:'Grupo B', area:4887.5, vgv:116.48, props:[] },
  ]},
  { id:'quadra-99', name:'Quadra 99', vpm2_alvo:1500, lotes:[
    { nome:'Lote 1', dono:'Grupo B', area:6500, vgv:165.18, props:[] },
    { nome:'Lote 2', dono:'TPA', area:6500, vgv:165.18, props:[
      { buyer:'Riva Incorporadora', tipo:'permuta', permutaPct:10.5, vgv:126.505, valor:12.58, valorLiquido:11.32, vpm2:1935, areaConsiderada:6500, date:'2026-06-10', validade:'2026-07-10', pagamento:'Fluxo de recebíveis + medição de obra. Opção de compra 90 dias.', notes:'Desconto de 10% de comercialização embutido no líquido. Lote 2 é somente do André (matrícula 22.395).' },
      { buyer:'Tenda Permuta', tipo:'permuta', permutaPct:10.74, vgv:122.402, valor:13.146, valorLiquido:12.883, vpm2:2022, areaConsiderada:6500, date:'2026-06-24', validade:'2026-07-24', pagamento:'Permuta financeira 10,74%. 380 unid. de 39,03 m², T+15, R$ 322.110/unid. Opção de compra 90 dias, lançamento 12+6 meses.', notes:'Via André Romcy / NUAAR. ⚠️ Vendedor paga 2% de corretagem. Valor referencial R$ 13.145.966,54 (R$ 2.022,45/m²).' },
      { buyer:'Tenda Pagamento', tipo:'venda', vgv:122.402, valor:12.909, valorLiquido:12.651, sinal:0.645450, parcela:0.340654, nParc:36, vpm2:1986, areaConsiderada:6500, date:'2026-06-24', validade:'2026-07-24', pagamento:'Fluxo financeiro: sinal R$ 645.450 + 36 parcelas de R$ 340.654,17. 380 unid. de 39,03 m², T+15. Opção de compra 90 dias.', notes:'Via André Romcy / NUAAR. ⚠️ Vendedor paga 2% de corretagem. Valor referencial R$ 12.909.000 (R$ 1.986/m²).' },
    ]},
  ]},
  { id:'quadra-6', name:'Quadra 6', vpm2_alvo:2000, lotes:[
    { nome:'Quadra inteira', dono:'ERG Par/Família', area:4300, vgv:71.8, props:[] },
  ]},
  { id:'gleba-8s', name:'Gleba 8S', vpm2_alvo:2000, lotes:[
    { nome:'Gleba inteira (em divisão)', dono:'ERG Par/Família', area:96784, vgv:1766.5, props:[
      { buyer:'Construtora Duplo / Idibra', tipo:'permuta-fisica', permutaPct:40, vgv:825.0, valor:99.0, valorLiquido:null, vpm2:1200, areaConsiderada:82500, escopo:'Gleba inteira', date:'2026-06-01', validade:'2026-07-01', pagamento:'Recebe 40% em unidades prontas. PCV 180 dias, lançamento 24+12 meses.', notes:'VGV ofertado = R$ 10.000/m² × 82.500 m² = R$ 825M. ⚠️ Vendedor paga 2% de corretagem (~R$ 2,0M). Via André Romcy / NUAAR.' },
      { buyer:'Riva Incorporadora', tipo:'permuta', permutaPct:11, vgv:175.203, valor:17.76, valorLiquido:15.98, vpm2:1851, areaConsiderada:9598, escopo:'Quadra 5 — Aldir Mentor', date:'2026-06-10', validade:'2026-07-10', pagamento:'Fluxo de recebíveis + medição de obra. Opção de compra 90 dias.', notes:'Desconto de 10% de comercialização embutido no líquido. Cobre só a Quadra 5 (9.598 m²), menor que a cota de um sócio (16.130 m²). ⚠️ PDF da Riva traz "Quadra 5" nos valores e "Quadra 4" nas premissas.' },
    ]},
  ]},
  { id:'quadra-xim', name:'Quadra XIM', vpm2_alvo:2000, lotes:[
    { nome:'Quadra inteira', dono:'ERG Par/Família', area:10183, vgv:227.733, props:[
      { buyer:'Riva Incorporadora', tipo:'permuta', permutaPct:12, vgv:227.733, valor:21.86, valorLiquido:19.67, vpm2:2147, areaConsiderada:10183, date:'2026-06-10', validade:'2026-07-10', pagamento:'Fluxo de recebíveis + medição de obra. Opção de compra 90 dias.', notes:'Desconto de 10% de comercialização embutido no líquido.' },
    ]},

  { id:'quadra-6pe', name:'Quadra 6PE', vpm2_alvo:2000, lotes:[

      { buyer:'Victa', tipo:'permuta', permutaPct:11, vgv:91.8, valor:10.098, valorLiquido:10.098, vpm2:1781, areaConsiderada:5671, date:'2026-04-01', validade:null, pagamento:'11% do VGV em moeda corrente, conforme vendas e medição. 360 unid. em 2 torres, ~R$ 255 mil/unid.', notes:'Área residencial 5.671,24 m² a confirmar após regularização. Cronograma de 6 anos. Proposta R03, abril/2026.' },
    ]},
  ]},
];

// ── HELPERS ───────────────────────────────────────────────────────────────────
const fmtN  = v => v != null ? Number(v).toLocaleString('pt-BR', {maximumFractionDigits:0}) : '—';
const fmtM  = v => v != null ? 'R$ ' + Number(v).toLocaleString('pt-BR', {minimumFractionDigits:1, maximumFractionDigits:1}) + ' M' : '—';
const fmtM2 = v => v != null ? 'R$ ' + Math.round(v).toLocaleString('pt-BR') : '—';
const fmtVGV = v => v == null ? '—' : (v >= 1000
  ? 'R$ ' + (v/1000).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' bi'
  : 'R$ ' + Number(v).toLocaleString('pt-BR', {minimumFractionDigits:1, maximumFractionDigits:1}) + ' M');
const fmtDate = d => { if(!d) return '—'; const [y,m,dd]=d.split('-'); return `${dd}/${m}/${y}`; };

const DONO_COLOR = {
  'TPA':             {bg:'#e3efe8', fg:'#1a6e4a'},
  'Grupo A':         {bg:'#e6eef7', fg:'#2b5f9e'},
  'Otto + Bernardo': {bg:'#e0eff0', fg:'#1f7a82'},
  'Grupo B':         {bg:'#f4e7e0', fg:'#b0541d'},
  'ERG Par/Família': {bg:'#ece6f4', fg:'#6a4ea0'},
};
const chip = dono => { const c = DONO_COLOR[dono] || {bg:'#efefeb', fg:'#8a8a86'}; return `<span class="chip" style="background:${c.bg};color:${c.fg}">${dono}</span>`; };
const liqP = p => p.valorLiquido != null ? p.valorLiquido : p.valor;
const tipoLabel = p => (p.tipo==='permuta' ? `Permuta financeira ${String(p.permutaPct).replace('.',',')}%`
  : p.tipo==='permuta-fisica' ? `Permuta física ${String(p.permutaPct).replace('.',',')}%`
  : p.tipo==='venda' ? 'Fluxo financeiro' : 'Outro');

const pedidoLote   = (t, l) => l.area * (l.vpm2 || t.vpm2_alvo) / 1e6;
const pedidoTerreno= t => t.lotes.reduce((s,l)=> s + pedidoLote(t,l), 0);
const areaTerreno  = t => t.lotes.reduce((s,l)=> s + l.area, 0);
const vgvTerreno   = t => { const s = t.lotes.reduce((a,l)=> a + (l.vgv||0), 0); return s || null; };
const bestProp     = l => l.props.length ? l.props.reduce((a,b)=> liqP(b)>liqP(a)?b:a) : null;
const bestLote     = l => { const p = bestProp(l); return p ? liqP(p) : null; };
const ofertaTerreno= t => { let s=0,has=false; for(const l of t.lotes){ const b=bestLote(l); if(b!=null){s+=b;has=true;} } return has?s:null; };
// VGV ofertado: o que a proposta calculou (por lote = maior; por terreno = soma dos lotes)
const vgvOfLote    = l => { const v = l.props.map(p=>p.vgv).filter(x=>x!=null); return v.length?Math.max(...v):null; };
const vgvOfTerreno = t => { let s=0,has=false; for(const l of t.lotes){ const v=vgvOfLote(l); if(v!=null){s+=v;has=true;} } return has?s:null; };
// área da oferta (a considerada pela melhor proposta)
const ofAreaLote   = l => { const p = bestProp(l); return p ? p.areaConsiderada : null; };
const ofAreaTerreno= t => { let s=0,has=false; for(const l of t.lotes){ const a=ofAreaLote(l); if(a!=null){s+=a;has=true;} } return has?s:null; };

const vgvTxt = v => v==null ? '—' : fmtVGV(v);

// começa com todos os terrenos abertos (mostra lotes/ofertas dentro de cada quadra)
let open = new Set(TERRENOS.map(t => 'T:'+t.id));
const rowKey = (ti, li, pi) => `${ti}.${li}.${pi==null?'x':pi}`;

// ── RENDER ────────────────────────────────────────────────────────────────────
const COLS = 8;
const isTPA = t => t.lotes.every(l => l.dono === 'TPA');
const fmtArea = a => a!=null ? fmtN(a)+' m²' : '';

function renderTotals() {
  const nProps = TERRENOS.reduce((s,t)=> s + t.lotes.reduce((a,l)=> a + l.props.length, 0), 0);
  const pedido = TERRENOS.reduce((s,t)=> s + pedidoTerreno(t), 0);
  const ofertado = TERRENOS.reduce((s,t)=> s + (ofertaTerreno(t)||0), 0);
  const vgvPot = TERRENOS.reduce((s,t)=> s + (vgvTerreno(t)||0), 0);
  const vgvOf  = TERRENOS.reduce((s,t)=> s + (vgvOfTerreno(t)||0), 0);
  // VGV potencial sem Grupo B: exclui lotes Grupo B inteiros e metade dos ERG Par/Família (3 de 6 sócios são Grupo B)
  const vgvSemB = TERRENOS.reduce((s,t)=> s + t.lotes.reduce((a,l)=> {
    if (!l.vgv || l.dono === 'Grupo B') return a;
    if (l.dono === 'ERG Par/Família')   return a + l.vgv * 0.5;
    return a + l.vgv;
  }, 0), 0);
  document.getElementById('totals').innerHTML = `
    <div><span class="lbl">Terrenos</span><span class="val">${TERRENOS.length}</span></div>
    <div><span class="lbl">Propostas</span><span class="val">${nProps}</span></div>
    <div><span class="lbl">VGV potencial</span><span class="val">${fmtVGV(vgvPot)}</span></div>
    <div><span class="lbl">Valor pedido</span><span class="val">${fmtM(pedido)}</span></div>
    <div><span class="lbl">VGV ofertado</span><span class="val">${fmtVGV(vgvOf)}</span></div>
    <div><span class="lbl">Ofertado (líq.)</span><span class="val">${fmtM(ofertado)}</span></div>
    <div><span class="lbl">VGV pot. s/ Grupo B</span><span class="val">${fmtVGV(vgvSemB)}</span></div>`;
}

function detailRow(t, p) {
  const vpm2Of = liqP(p) * 1e6 / p.areaConsiderada;
  return `<tr class="detail"><td colspan="${COLS}">
    <div class="d-grid">
      <div><div class="lbl">Modelo</div><div class="v">${tipoLabel(p)}</div></div>
      <div><div class="lbl">Área considerada</div><div class="v">${fmtN(p.areaConsiderada)} m²</div></div>
      <div><div class="lbl">R$/m² pedido → oferta</div><div class="v">${fmtM2(t.vpm2_alvo)} → ${fmtM2(vpm2Of)}</div></div>
      <div><div class="lbl">Validade</div><div class="v">${fmtDate(p.validade)}</div></div>
    </div>
    <div class="d-notes">${p.pagamento?`<b>Pagamento:</b> ${p.pagamento}`:''}${p.notes?`<br>${p.notes.replace(/⚠️([^.]*\.)/g,'<span class="warn">⚠️$1</span>')}`:''}</div>
  </td></tr>`;
}

// linhas das construtoras (uma por proposta) sob um lote → expandem no detalhe
function propRows(t, l, li, lvl2) {
  let h = '';
  const ratePed = (l.vgv && l.area) ? l.vgv / l.area : null;   // VGV pedido por m² do lote
  l.props.forEach((p, pi) => {
    const k = rowKey(t.id, li, pi);
    const o = open.has(k);
    const vgvPed = ratePed != null ? ratePed * p.areaConsiderada : null;
    h += `<tr class="prop clickable ${lvl2?'lvl2':''} ${o?'open':''}" onclick="toggle('${k}')">
      <td><span class="chev">▶</span>${p.buyer}${p.escopo?` <span class="who">· ${p.escopo}</span>`:''}</td>
      <td class="hide-sm"></td>
      <td></td>
      <td>${vgvTxt(vgvPed)}</td>
      <td>${fmtM(p.areaConsiderada * (l.vpm2 || t.vpm2_alvo) / 1e6)}</td>
      <td>${fmtArea(p.areaConsiderada)}</td>
      <td>${vgvTxt(p.vgv)}</td>
      <td>${fmtM(liqP(p))}</td>
    </tr>`;
    if (o) h += detailRow(t, p);
  });
  return h;
}

function render() {
  renderTotals();
  let html = `<thead><tr>
    <th class="l">Terreno / lote</th>
    <th class="l hide-sm">Proprietário</th>
    <th>Área</th>
    <th>VGV potencial</th>
    <th>Valor pedido</th>
    <th>Área da oferta</th>
    <th>VGV ofertado</th>
    <th>Oferta líq.</th>
  </tr></thead><tbody>`;

  // ordem: terrenos da TPA por último; dentro de cada grupo, por VGV potencial desc
  const ordered = [...TERRENOS].sort((a,b) => {
    if (isTPA(a) !== isTPA(b)) return isTPA(a) ? 1 : -1;
    return (vgvTerreno(b)||0) - (vgvTerreno(a)||0);
  });

  ordered.forEach((t) => {
    const single   = t.lotes.length === 1;
    const hasProps = t.lotes.some(l => l.props.length > 0);
    const expandable = !single || hasProps;
    const tKey = 'T:'+t.id;
    const tOpen = open.has(tKey);
    const ownerCell = chip(isTPA(t) ? 'TPA' : 'ERG Par/Família');
    const ofTer = ofertaTerreno(t);

    html += `<tr class="terreno ${expandable?'clickable':''} ${tOpen?'open':''}" ${expandable?`onclick="toggle('${tKey}')"`:''}>
      <td>${expandable?'<span class="chev">▶</span>':'<span style="display:inline-block;width:13px"></span>'}${t.name}</td>
      <td class="hide-sm">${ownerCell}</td>
      <td>${fmtN(areaTerreno(t))} m²</td>
      <td>${vgvTxt(vgvTerreno(t))}</td>
      <td>${fmtM(pedidoTerreno(t))}</td>
      <td>${fmtArea(ofAreaTerreno(t))}</td>
      <td>${vgvTxt(vgvOfTerreno(t))}</td>
      <td>${ofTer!=null ? fmtM(ofTer) : '<span class="semprop">sem proposta</span>'}</td>
    </tr>`;

    if (!expandable || !tOpen) return;

    // terreno de 1 lote: mostra direto as construtoras
    if (single) { html += propRows(t, t.lotes[0], 0, false); return; }

    // terreno com vários lotes: linha de cada lote; lote com proposta abre nas construtoras
    t.lotes.forEach((l, li) => {
      const hasP = l.props.length > 0;
      const lKey = 'L:'+t.id+'.'+li;
      const lOpen = open.has(lKey);
      html += `<tr class="lote ${hasP?'clickable':''} ${lOpen?'open':''}" ${hasP?`onclick="toggle('${lKey}')"`:''}>
        <td>${hasP?'<span class="chev">▶</span>':'<span style="display:inline-block;width:13px"></span>'}${l.nome}</td>
        <td class="hide-sm">${chip(l.dono)}</td>
        <td>${fmtN(l.area)} m²</td>
        <td>${vgvTxt(l.vgv)}</td>
        <td>${fmtM(pedidoLote(t,l))}</td>
        <td>${fmtArea(ofAreaLote(l))}</td>
        <td>${vgvTxt(vgvOfLote(l))}</td>
        <td>${hasP ? fmtM(bestLote(l)) : '<span class="semprop">sem proposta</span>'}</td>
      </tr>`;
      if (hasP && lOpen) html += propRows(t, l, li, true);
    });
  });

  html += `</tbody>`;
  document.getElementById('tbl').innerHTML = html;
}

function toggle(k){ open.has(k)?open.delete(k):open.add(k); render(); }

// ── COMPARADOR DE FLUXO DE CAIXA ──────────────────────────────────────────────
const HORIZON = 60;                 // 5 anos até fechar os fluxos
const SALES_START = 18;             // permuta financeira: vendas começam no Lançamento (mês 18)
const ETAPAS = [
  { n:'Promessa',   m:0 },  { n:'Análise', m:3 },  { n:'Alvará', m:15 },
  { n:'Lançamento', m:18 }, { n:'Obras',   m:24 }, { n:'Habite-se', m:60 },
];
// Projeções anuais (medianas de mercado, ago/2026 — Focus/FGV), anos 2026..2030
const PROJ = {
  'IPCA':  [5.30, 4.18, 3.70, 3.50, 3.50],
  'INCC':  [6.50, 5.50, 5.00, 4.50, 4.50],
  'CDI':   [13.90, 11.90, 10.40, 10.00, 9.50],
  'Dólar': [2.00, 1.50, 0.40, 1.90, 1.80],
};
const P1_COLOR = '#1a6e4a', P2_COLOR = '#6a4ea0';
const CMP = { loteKey:null, a:0, b:1, idx:'IPCA', sales:null, repasse:40 };

// curva de vendas: buckets anuais do Lançamento ao Habite-se
function salesBuckets(){ const b=[]; let m=SALES_START; while(m<=HORIZON){ const fim=Math.min(HORIZON, m+11); b.push({ini:m, fim}); m=fim+1; } return b; }
function ensureSales(){
  const bs=salesBuckets();
  if(!CMP.sales || CMP.sales.length!==bs.length){
    CMP.sales = bs.map(bk => Math.round((bk.fim-bk.ini+1)/(HORIZON-SALES_START+1)*100));
    const s=CMP.sales.reduce((a,b)=>a+b,0); CMP.sales[CMP.sales.length-1] += (100-s);   // fecha em 100%
  }
}
const yBucket = m => Math.min(4, Math.floor(m/12));
const monF = a => Math.pow(1 + a/100, 1/12);
// correção IPCA acumulada do mês 0 até t (saldo devido reajustado por IPCA)
function corrIPCA(t){ let f=1; for(let m=0;m<t;m++) f *= monF(PROJ['IPCA'][yBucket(m)]); return f; }
// taxa de reinvestimento no mês m — só o Dólar leva +6%
function reinvRate(m, idx){ return idx==='Dólar' ? PROJ['Dólar'][yBucket(m)] + 6 : PROJ[idx][yBucket(m)]; }
// fluxo base (R$ milhões, moeda de hoje). Cada entrada vai para a linha e é reinvestida até o mês 60.
function baseFlow(p){                               // R$ M brutos (sem corretagem)
  const f = new Array(HORIZON+1).fill(0), val = p.valor || 0;
  const ALVARA = 15;                                // escritura / alvará = mês 15
  if (p.tipo === 'venda') {                         // fluxo financeiro: sinal na cabeça, parcelas a partir do alvará
    f[0] += (p.sinal||0);
    for (let i=0; i<(p.nParc||0); i++) f[ALVARA+i] += (p.parcela||0);
  } else if (p.tipo === 'permuta-fisica') {         // unidades entregues no Habite-se
    f[HORIZON] += val;
  } else {                                          // permuta financeira
    let upfront = 0;
    if (p.sinalPCV)  { f[0] += p.sinalPCV;  upfront += p.sinalPCV; }        // ex.: Riva 500k na PCV
    if (p.escritura) { f[ALVARA] += p.escritura; upfront += p.escritura; }  // ex.: Riva 2M na escritura
    const vendas = Math.max(0, val - upfront), rep = (CMP.repasse||0)/100;
    const entrada = vendas * (1 - rep);             // entrada dos compradores, ao longo das vendas
    salesBuckets().forEach((bk,k)=>{ const mm=bk.fim-bk.ini+1, amt=entrada*(CMP.sales[k]||0)/100/mm;
      for (let m=bk.ini; m<=bk.fim; m++) f[m] += amt; });
    f[HORIZON] += vendas * rep;                     // repasse dos bancos no Habite-se
  }
  return f;
}
function computeFlow(p, idx){
  const base = baseFlow(p);
  const nominal = base.map((v,t)=> v * corrIPCA(t));      // saldo devido corrigido por IPCA
  const bal = new Array(HORIZON+1).fill(0);               // saldo reinvestido: cada entrada rende até o mês 60
  bal[0] = nominal[0];
  for (let m=1; m<=HORIZON; m++) bal[m] = bal[m-1]*monF(reinvRate(m, idx)) + nominal[m];
  return { nominal, bal, totN: nominal.reduce((a,b)=>a+b,0), totR: bal[HORIZON] };
}

function drawChart(f, color, maxBar, maxCum){
  const W=920, H=250, ml=46, mr=44, mt=16, mb=32;
  const pw=W-ml-mr, ph=H-mt-mb, step=pw/HORIZON;
  const xM = m => ml + (m/HORIZON)*pw;
  const yBar = v => mt + ph*(1 - v/maxBar);
  const yCum = v => mt + ph*(1 - v/maxCum);
  const bw = Math.max(2.4, step*0.5);
  let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="inherit">`;
  const ticks=3;
  for(let i=0;i<=ticks;i++){ const v=maxBar*i/ticks, y=yBar(v);
    s+=`<line x1="${ml}" y1="${y.toFixed(1)}" x2="${ml+pw}" y2="${y.toFixed(1)}" stroke="#eee"/>`;
    s+=`<text x="${ml-7}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="9.5" fill="#8a8a86">${v.toFixed(1)}</text>`; }
  ETAPAS.forEach(e=>{ const x=xM(e.m);
    s+=`<line x1="${x.toFixed(1)}" y1="${mt}" x2="${x.toFixed(1)}" y2="${mt+ph}" stroke="#e2e2dd" stroke-dasharray="3 3"/>`; });
  for(let m=0;m<=HORIZON;m+=12){ const x=xM(m);
    s+=`<text x="${x.toFixed(1)}" y="${mt+ph+15}" text-anchor="middle" font-size="9.5" fill="#8a8a86">mês ${m}</text>`; }
  for(let m=0;m<=HORIZON;m++){ if(f.nominal[m]>1e-9){ const h=ph*(f.nominal[m]/maxBar);
    s+=`<rect x="${(xM(m)-bw/2).toFixed(1)}" y="${yBar(f.nominal[m]).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${color}" opacity="0.5"/>`; } }
  let d=''; for(let m=0;m<=HORIZON;m++) d+=(m?'L':'M')+xM(m).toFixed(1)+' '+yCum(f.bal[m]).toFixed(1)+' ';
  s+=`<path d="${d}" fill="none" stroke="${color}" stroke-width="2"/>`;
  s+=`<text x="${(xM(HORIZON)-3).toFixed(1)}" y="${(yCum(f.bal[HORIZON])-6).toFixed(1)}" text-anchor="end" font-size="10.5" font-weight="700" fill="${color}">${fmtM(f.bal[HORIZON])}</text>`;
  return s + `</svg>`;
}

function cmpLotes(){
  const a=[];
  TERRENOS.forEach(t=> t.lotes.forEach((l,li)=>{ if(l.props.length>=2) a.push({ key:t.id+'.'+li, t, l, li, label:`${t.name} — ${l.nome}` }); }));
  return a;
}

function renderComparador(){
  ensureSales();
  const root = document.getElementById('cmpRoot');
  const lotes = cmpLotes();
  if(!lotes.length){ root.innerHTML='<p class="muted">Nenhum lote com 2 ou mais propostas para comparar.</p>'; return; }
  let cur = lotes.find(x=>x.key===CMP.loteKey) || lotes[0]; CMP.loteKey = cur.key;
  const N = cur.l.props.length;
  if(CMP.a>=N) CMP.a=0;
  if(CMP.b>=N) CMP.b = N>1?1:0;
  if(CMP.a===CMP.b) CMP.b = (CMP.a+1)%N;
  const p1=cur.l.props[CMP.a], p2=cur.l.props[CMP.b];
  const f1=computeFlow(p1,CMP.idx), f2=computeFlow(p2,CMP.idx);
  const maxBar = Math.max(1e-6, ...f1.nominal, ...f2.nominal);
  const maxCum = Math.max(1e-6, f1.bal[HORIZON], f2.bal[HORIZON]);
  const max1 = f1.totR >= f2.totR;
  const reinvLbl = CMP.idx==='Dólar' ? 'Dólar + 6%' : CMP.idx;

  const opt=(items,sel)=>items.map(it=>`<option value="${it.v}" ${it.v==sel?'selected':''}>${it.t}</option>`).join('');
  const loteOpts = opt(lotes.map(x=>({v:x.key,t:x.label})), cur.key);
  const p1Opts   = opt(cur.l.props.map((p,i)=>({v:i,t:p.buyer})), CMP.a);
  const p2Opts   = opt(cur.l.props.map((p,i)=>({v:i,t:p.buyer})), CMP.b);
  const idxOpts  = opt(Object.keys(PROJ).map(k=>({v:k,t:k==='Dólar'?'Dólar + 6%':k})), CMP.idx);

  const buckets = salesBuckets();
  const salesFields = buckets.map((bk,k)=>`<div class="yr"><label>Ano ${k+1} <span class="mrange">m${bk.ini}–${bk.fim}</span></label><input type="number" min="0" max="100" value="${CMP.sales[k]}" onchange="CMP.sales[${k}]=+this.value||0;renderComparador()"></div>`).join('');
  const salesSum = CMP.sales.reduce((a,b)=>a+b,0);
  const anyPerm = p1.tipo==='permuta' || p2.tipo==='permuta';

  const block=(p,f,color,num,isMax)=>`
    <div class="prop-block">
      <h3><span class="num" style="background:${color}">${num}</span>${p.buyer} <span class="tag">${tipoLabel(p)}</span></h3>
      <div class="prop-terms">
        <div><span class="lbl">VGV ofertado</span><span class="val">${fmtVGV(p.vgv)}</span></div>
        <div><span class="lbl">Valor da proposta</span><span class="val">${fmtM(p.valor)}</span></div>
        <div><span class="lbl">Total recebido</span><span class="val">${fmtM(f.totN)}</span></div>
        <div><span class="lbl">Reinvestido · ${reinvLbl}</span><span class="val" style="color:${color}">${fmtM(f.totR)}${isMax?`<span class="best" style="background:${color}">maior</span>`:''}</span></div>
      </div>
      <div class="prop-chart">${drawChart(f,color,maxBar,maxCum)}</div>
      <div class="chart-cap">Barras: recebido no mês · Linha: saldo reinvestido, evolui até o mês 60 (chega a ${fmtM(f.totR)})</div>
    </div>`;

  root.innerHTML = `
    <div class="cmp-controls">
      <div class="cmp-field"><label>Terreno / lote</label>
        <select onchange="CMP.loteKey=this.value;CMP.a=0;CMP.b=1;renderComparador()">${loteOpts}</select></div>
      <div class="cmp-field"><label>Proposta 1</label>
        <select onchange="CMP.a=+this.value;if(CMP.a===CMP.b)CMP.b=(CMP.a+1)%${N};renderComparador()">${p1Opts}</select></div>
      <div class="cmp-field"><label>Proposta 2</label>
        <select onchange="CMP.b=+this.value;if(CMP.b===CMP.a)CMP.a=(CMP.b+1)%${N};renderComparador()">${p2Opts}</select></div>
      <div class="cmp-field"><label>Reinvestimento</label>
        <select onchange="CMP.idx=this.value;renderComparador()">${idxOpts}</select></div>
    </div>
    <div class="sales-box ${anyPerm?'':'off'}">
      <div class="sales-head">Curva de vendas e repasse — permuta financeira <span class="muted">(% vendido por ano durante a obra; % repasse = parte paga pelos bancos no Habite-se)</span></div>
      <div class="sales-input">${salesFields}<div class="sales-sum ${salesSum!==100?'bad':''}">soma ${salesSum}%</div>
        <div class="yr rep"><label>% repasse <span class="mrange">Habite-se</span></label><input type="number" min="0" max="100" value="${CMP.repasse}" onchange="CMP.repasse=+this.value||0;renderComparador()"></div>
      </div>
    </div>
    <div class="stepper">${ETAPAS.map(e=>`<div class="step"><div class="m">mês ${e.m}</div><div class="n">${e.n}</div></div>`).join('')}</div>
    ${block(p1,f1,P1_COLOR,1,max1)}
    ${block(p2,f2,P2_COLOR,2,!max1)}`;
}

function setView(v){
  document.getElementById('viewPropostas').style.display = v==='p' ? '' : 'none';
  document.getElementById('viewComparador').style.display = v==='c' ? '' : 'none';
  document.getElementById('navP').classList.toggle('active', v==='p');
  document.getElementById('navC').classList.toggle('active', v==='c');
  if(v==='c') renderComparador();
}

render();
</script>
